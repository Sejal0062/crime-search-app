
services:
  crime_backend:
    build:
      context: ./crime-awareness-backend/crime-awareness
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/crime_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      NEWS_API_KEY: ${NEWS_API_KEY}
      VIDEO_API_KEY: ${VIDEO_API_KEY}
    restart: always

  crime_frontend:
    build:
      context: ./crime-awareness-frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - crime_backend
    restart: always
